name: CI

on:
  push:
    branches: [main, master, "integration/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-config:
    name: Production HTTPS / exposure config
    runs-on: ubuntu-latest
    env:
      PUBLIC_DOMAIN: jobs.qlink.cn
      PUBLIC_ORIGIN: https://jobs.qlink.cn
      ACME_EMAIL: operator@qlink.cn
      POSTGRES_PASSWORD: ci-production-config-database-secret
      SECRET_KEY: ci-production-config-access-secret-at-least-32-bytes
      FIDELITY_PROOF_SECRET_KEY: ci-production-config-proof-secret-at-least-32-bytes
      EMPLOYER_INVITE_CODE: ci-production-invite
    steps:
      - uses: actions/checkout@v6
      - name: Validate merged production Compose config
        run: docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
      - name: Validate automatic HTTPS config
        run: >-
          docker run --rm
          -e PUBLIC_DOMAIN
          -e ACME_EMAIL
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  backend:
    name: Backend lint / type / test / migrate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppassword
          POSTGRES_DB: jobplatform_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appuser -d jobplatform_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://appuser:apppassword@localhost:5432/jobplatform_test_ci
      # pytest reads TEST_DATABASE_URL, while the production migration entrypoint
      # intentionally reads DATABASE_URL.  They must target the same CI service.
      DATABASE_URL: postgresql+asyncpg://appuser:apppassword@localhost:5432/jobplatform_test_ci
      REQUIRE_SCHEMA_VERSION: "0"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff (bug-oriented)
        run: ruff check app scripts tests
      - name: Ruff format
        run: ruff format --check app scripts tests
      - name: Mypy (scoped)
        run: mypy app/fairness.py app/migration_sql.py app/schema_version.py app/background_jobs.py
      - name: Unit / integration tests
        run: python -m pytest
      - name: PostgreSQL concurrency tests
        run: python -m pytest -m postgresql tests/test_pr3_postgres_concurrency.py
      - name: Migrate twice on fresh PostgreSQL
        run: |
          python scripts/migrate.py
          python scripts/migrate.py
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend lint / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Assert route-level code splitting
        run: |
          python - <<'PY'
          from pathlib import Path
          assets = Path("dist/assets")
          chunks = list(assets.glob("*.js"))
          assert len(chunks) >= 5, f"expected lazy chunks, found {len(chunks)}"
          print(f"js chunks: {len(chunks)}")
          for path in sorted(chunks, key=lambda p: p.stat().st_size, reverse=True)[:8]:
              print(f"{path.name}: {path.stat().st_size}")
          PY

  e2e-smoke:
    name: API smoke against migrated stack
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppassword
          POSTGRES_DB: jobplatform_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appuser -d jobplatform_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://appuser:apppassword@localhost:5432/jobplatform_e2e
      REDIS_URL: redis://localhost:6379/0
      REQUIRE_SCHEMA_VERSION: "1"
      ENV: production
      SECRET_KEY: ci-only-access-secret-at-least-32-bytes
      FIDELITY_PROOF_SECRET_KEY: ci-only-proof-secret-at-least-32-bytes
      CORS_ORIGINS: http://127.0.0.1:8000
      MODEL_REQUIRED: "false"
      REQUIRE_BACKGROUND_HEARTBEATS: "false"
      PYTHONPATH: .
      UPLOAD_DIR: /home/runner/work/uploads
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Prepare upload dir
        run: mkdir -p /home/runner/work/uploads
      - name: Migrate
        working-directory: backend
        run: python scripts/migrate.py
      - name: Start API and smoke
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/ready | tee /tmp/ready.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/ready.json"))
          # Public /ready exposes only the safe model state used by the
          # rules-only availability banner. All infrastructure details remain
          # restricted to /admin/readiness.
          assert data["status"] == "ready", data
          assert data["model_mode"] == "rules_only", data
          assert set(data["checks"]) == {"model"}, data
          assert data["checks"]["model"]["mode"] == "rules_only", data
          serialized = json.dumps(data).lower()
          assert "api_key" not in serialized and "secret" not in serialized, data
          print("ready smoke ok")
          PY

  browser-e2e:
    name: Browser full-chain E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppassword
          POSTGRES_DB: jobplatform_browser_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appuser -d jobplatform_browser_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://appuser:apppassword@localhost:5432/jobplatform_browser_e2e
      REDIS_URL: redis://localhost:6379/0
      REQUIRE_SCHEMA_VERSION: "1"
      ENV: production
      SECRET_KEY: ci-only-access-secret-at-least-32-bytes
      FIDELITY_PROOF_SECRET_KEY: ci-only-proof-secret-at-least-32-bytes
      CORS_ORIGINS: http://127.0.0.1:4173
      MODEL_REQUIRED: "false"
      REQUIRE_BACKGROUND_HEARTBEATS: "false"
      EMPLOYER_INVITE_CODE: e2e-employer-invite
      E2E_API_ORIGIN: http://127.0.0.1:8000
      E2E_PORT: "4173"
      PYTHONPATH: backend
      BACKGROUND_JOBS_INLINE: "0"
      VIRUS_SCAN_ENABLED: "false"
      UPLOAD_DIR: /home/runner/work/uploads
      EVIDENCE_VAULT_DIR: /home/runner/work/evidence-vault
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install frontend + Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Prepare upload dir
        run: mkdir -p /home/runner/work/uploads /home/runner/work/evidence-vault
      - name: Run browser E2E
        run: bash scripts/run_browser_e2e.sh

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Run MIT gitleaks binary directly (avoids gitleaks-action license gating).
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSLf \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact
