[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
# Default suite stays on SQLite. PostgreSQL concurrency must be run explicitly:
#   TEST_DATABASE_URL=postgresql+asyncpg://.../jobplatform_test \
#     .venv/bin/python -m pytest -q -m postgresql tests/test_pr3_postgres_concurrency.py
addopts = -q -m "not postgresql"
markers =
    integration: tests requiring external integration services
    postgresql: tests that must run against PostgreSQL and never SQLite
