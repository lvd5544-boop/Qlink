name: ai-job-platform

x-backend-environment: &backend-environment
  ENV: production
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jobplatform}
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  FIDELITY_PROOF_SECRET_KEY: ${FIDELITY_PROOF_SECRET_KEY:?set FIDELITY_PROOF_SECRET_KEY}
  CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
  AUTH_STATE_BACKEND: redis
  APPLICATION_EVENT_BACKEND: redis
  REQUIRE_SCHEMA_VERSION: "true"
  METERING_ENABLED: "true"
  BILLING_TIMEZONE: Asia/Shanghai
  UPLOAD_DIR: /data/uploads
  EVIDENCE_VAULT_DIR: /data/evidence-vault
  OBJECT_STORAGE_BACKEND: ${OBJECT_STORAGE_BACKEND:-local}
  SIGNED_URL_TTL_SECONDS: ${SIGNED_URL_TTL_SECONDS:-300}
  EVIDENCE_DOWNLOAD_SIGNING_KEY: ${EVIDENCE_DOWNLOAD_SIGNING_KEY:-}
  VIRUS_SCAN_ENABLED: ${VIRUS_SCAN_ENABLED:-true}
  VIRUS_SCAN_FAIL_MODE: ${VIRUS_SCAN_FAIL_MODE:-closed}
  CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
  CLAMAV_PORT: ${CLAMAV_PORT:-3310}
  CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-10}
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
  UPLOAD_MAX_PAGES: ${UPLOAD_MAX_PAGES:-30}
  UPLOAD_MAX_ARCHIVE_ENTRIES: ${UPLOAD_MAX_ARCHIVE_ENTRIES:-1000}
  UPLOAD_MAX_UNCOMPRESSED_BYTES: ${UPLOAD_MAX_UNCOMPRESSED_BYTES:-20971520}
  UPLOAD_MAX_TEXT_CHARS: ${UPLOAD_MAX_TEXT_CHARS:-100000}
  UPLOAD_PARSE_TIMEOUT_SECONDS: ${UPLOAD_PARSE_TIMEOUT_SECONDS:-10}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  API_ROOT_PATH: /api
  REQUIRE_BACKGROUND_HEARTBEATS: "true"
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
  AI_ENABLED: ${AI_ENABLED:-true}
  AI_PRIMARY_PROVIDER: ${AI_PRIMARY_PROVIDER:-openai_compatible}
  AI_PRIMARY_BASE_URL: ${AI_PRIMARY_BASE_URL:-}
  AI_PRIMARY_API_KEY: ${AI_PRIMARY_API_KEY:-}
  AI_DATA_REGION: ${AI_DATA_REGION:-cn-beijing}
  AI_MODEL_DEFAULT: ${AI_MODEL_DEFAULT:-qwen-plus}
  AI_MODEL_RESUME_PARSE: ${AI_MODEL_RESUME_PARSE:-}
  AI_MODEL_INTERVIEW: ${AI_MODEL_INTERVIEW:-}
  AI_MODEL_REWRITE: ${AI_MODEL_REWRITE:-}
  AI_MODEL_REASONING: ${AI_MODEL_REASONING:-}
  AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-60}
  AI_MAX_RETRIES: ${AI_MAX_RETRIES:-1}
  AI_AUDIT_CONTENT_LOGGING: ${AI_AUDIT_CONTENT_LOGGING:-false}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
  INTERVIEW_GLOBAL_PROVIDER_CALLS_PER_DAY: ${INTERVIEW_GLOBAL_PROVIDER_CALLS_PER_DAY:-5000}
  MODEL_REQUIRED: ${MODEL_REQUIRED:-false}
  DEEPSEEK_INPUT_PRICE_CNY_PER_MILLION: ${DEEPSEEK_INPUT_PRICE_CNY_PER_MILLION:-}
  DEEPSEEK_OUTPUT_PRICE_CNY_PER_MILLION: ${DEEPSEEK_OUTPUT_PRICE_CNY_PER_MILLION:-}
  DEEPSEEK_CACHE_HIT_PRICE_CNY_PER_MILLION: ${DEEPSEEK_CACHE_HIT_PRICE_CNY_PER_MILLION:-}
  DEEPSEEK_CACHE_MISS_PRICE_CNY_PER_MILLION: ${DEEPSEEK_CACHE_MISS_PRICE_CNY_PER_MILLION:-}
  DEEPSEEK_PRICE_VERSION: ${DEEPSEEK_PRICE_VERSION:-unconfigured}
  EMPLOYER_INVITE_CODE: ${EMPLOYER_INVITE_CODE:?set EMPLOYER_INVITE_CODE}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_START_TLS: ${SMTP_START_TLS:-true}
  PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
  PASSWORD_RESET_LIMIT: ${PASSWORD_RESET_LIMIT:-3}
  PASSWORD_RESET_WINDOW_SECONDS: ${PASSWORD_RESET_WINDOW_SECONDS:-3600}
  LEGAL_ENTITY_NAME: ${LEGAL_ENTITY_NAME:-QLink pilot operator}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@example.invalid}
  PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-privacy@example.invalid}
  INCIDENT_CONTACT_EMAIL: ${INCIDENT_CONTACT_EMAIL:-incident@example.invalid}

services:
  db:
    image: pgvector/pgvector:0.7.4-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jobplatform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-jobplatform}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:1.4.5-debian13-slim
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav

  migration:
    build:
      context: ./backend
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "scripts/migrate.py"]
    restart: "no"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/data/uploads
      - evidence_vault_data:/data/evidence-vault
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "${WEB_CONCURRENCY:-2}"
      - --proxy-headers
      - --forwarded-allow-ips=*
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  scheduler:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/data/uploads
    command: ["python", "-m", "app.scheduler_service"]

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/data/uploads
    command: ["python", "-m", "app.background_jobs"]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Keep the application proxy private by default. Public production
      # traffic enters through the TLS edge in docker-compose.production.yml.
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  evidence_vault_data:
  clamav_data:
