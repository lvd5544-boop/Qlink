<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">QLink evidence-grounded job workflow</title>
  <desc id="desc">A four-stage workflow from target job and candidate evidence through diagnosis, user-reviewed preparation, interview, and outcome learning, with current synthetic evaluation evidence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9ff"/>
      <stop offset="1" stop-color="#eef8f6"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 37px; font-weight: 760; fill: #ffffff; letter-spacing: -0.5px; }
      .subtitle { font-size: 17px; font-weight: 450; fill: #dbeafe; }
      .card-title { font-size: 22px; font-weight: 720; fill: #0f172a; }
      .step { font-size: 13px; font-weight: 760; fill: #ffffff; letter-spacing: 1.1px; }
      .body { font-size: 16px; font-weight: 480; fill: #334155; }
      .small { font-size: 14px; font-weight: 480; fill: #475569; }
      .tag { font-size: 13px; font-weight: 650; fill: #1e3a8a; }
      .metric { font-size: 24px; font-weight: 780; fill: #0f172a; }
      .metric-label { font-size: 13px; font-weight: 520; fill: #475569; }
      .footer { font-size: 13px; font-weight: 550; fill: #64748b; }
    </style>
  </defs>

  <rect width="1440" height="760" rx="28" fill="url(#background)"/>
  <path d="M28 0 H1412 A28 28 0 0 1 1440 28 V148 H0 V28 A28 28 0 0 1 28 0 Z" fill="url(#header)"/>

  <g class="sans">
    <text x="62" y="65" class="title">QLink · Evidence → Decision → Application → Learning</text>
    <text x="62" y="101" class="subtitle">Synthetic showcase · AI suggestions never become candidate facts without explicit confirmation</text>
    <rect x="1090" y="46" width="286" height="42" rx="21" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.32"/>
    <text x="1233" y="72" text-anchor="middle" class="subtitle" style="font-size:15px;font-weight:650">Human-controlled decision support</text>

    <!-- arrows -->
    <path d="M355 354 H390" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M705 354 H740" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M1055 354 H1090" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

    <!-- card 1 -->
    <g filter="url(#shadow)">
      <rect x="40" y="190" width="315" height="330" rx="22" fill="#ffffff"/>
    </g>
    <rect x="62" y="212" width="84" height="28" rx="14" fill="#2563eb"/>
    <text x="104" y="231" text-anchor="middle" class="step">INPUT</text>
    <text x="62" y="278" class="card-title">Real sources first</text>
    <circle cx="74" cy="318" r="5" fill="#2563eb"/><text x="90" y="324" class="body">Target job description</text>
    <circle cx="74" cy="358" r="5" fill="#2563eb"/><text x="90" y="364" class="body">Candidate resume and Claims</text>
    <circle cx="74" cy="398" r="5" fill="#2563eb"/><text x="90" y="404" class="body">Evidence Vault artifacts</text>
    <circle cx="74" cy="438" r="5" fill="#2563eb"/><text x="90" y="444" class="body">Explicit preferences</text>
    <rect x="62" y="473" width="270" height="28" rx="14" fill="#eff6ff"/>
    <text x="197" y="492" text-anchor="middle" class="tag">Private resources remain owner-scoped</text>

    <!-- card 2 -->
    <g filter="url(#shadow)">
      <rect x="390" y="190" width="315" height="330" rx="22" fill="#ffffff"/>
    </g>
    <rect x="412" y="212" width="105" height="28" rx="14" fill="#7c3aed"/>
    <text x="464" y="231" text-anchor="middle" class="step">REASON</text>
    <text x="412" y="278" class="card-title">Separate the states</text>
    <rect x="412" y="304" width="80" height="31" rx="15" fill="#dcfce7"/><text x="452" y="325" text-anchor="middle" class="small" style="fill:#166534;font-weight:700">Ready</text>
    <rect x="501" y="304" width="85" height="31" rx="15" fill="#dbeafe"/><text x="543" y="325" text-anchor="middle" class="small" style="fill:#1d4ed8;font-weight:700">Clarify</text>
    <rect x="595" y="304" width="88" height="31" rx="15" fill="#fef3c7"/><text x="639" y="325" text-anchor="middle" class="small" style="fill:#92400e;font-weight:700">Develop</text>
    <rect x="412" y="346" width="112" height="31" rx="15" fill="#fee2e2"/><text x="468" y="367" text-anchor="middle" class="small" style="fill:#991b1b;font-weight:700">Constraint</text>
    <rect x="533" y="346" width="150" height="31" rx="15" fill="#f3e8ff"/><text x="608" y="367" text-anchor="middle" class="small" style="fill:#6b21a8;font-weight:700">Hypothesis ≤ 2</text>
    <text x="412" y="414" class="body">Sources + rule/model version</text>
    <text x="412" y="448" class="body">Validation status stays visible</text>
    <rect x="412" y="473" width="270" height="28" rx="14" fill="#faf5ff"/>
    <text x="547" y="492" text-anchor="middle" class="tag" style="fill:#6b21a8">“Not written” ≠ “cannot do”</text>

    <!-- card 3 -->
    <g filter="url(#shadow)">
      <rect x="740" y="190" width="315" height="330" rx="22" fill="#ffffff"/>
    </g>
    <rect x="762" y="212" width="107" height="28" rx="14" fill="#0f766e"/>
    <text x="815" y="231" text-anchor="middle" class="step">PREPARE</text>
    <text x="762" y="278" class="card-title">Preview before action</text>
    <circle cx="774" cy="318" r="5" fill="#0f766e"/><text x="790" y="324" class="body">Cited resume before/after diff</text>
    <circle cx="774" cy="358" r="5" fill="#0f766e"/><text x="790" y="364" class="body">New, reversible resume version</text>
    <circle cx="774" cy="398" r="5" fill="#0f766e"/><text x="790" y="404" class="body">Target-specific interview</text>
    <circle cx="774" cy="438" r="5" fill="#0f766e"/><text x="790" y="444" class="body">Candidate-confirmed observation</text>
    <rect x="762" y="473" width="270" height="28" rx="14" fill="#ecfdf5"/>
    <text x="897" y="492" text-anchor="middle" class="tag" style="fill:#047857">Explicit approval for high-impact actions</text>

    <!-- card 4 -->
    <g filter="url(#shadow)">
      <rect x="1090" y="190" width="310" height="330" rx="22" fill="#ffffff"/>
    </g>
    <rect x="1112" y="212" width="90" height="28" rx="14" fill="#c2410c"/>
    <text x="1157" y="231" text-anchor="middle" class="step">LEARN</text>
    <text x="1112" y="278" class="card-title">Outcome with provenance</text>
    <circle cx="1124" cy="318" r="5" fill="#c2410c"/><text x="1140" y="324" class="body">Platform / employer / candidate</text>
    <circle cx="1124" cy="358" r="5" fill="#c2410c"/><text x="1140" y="364" class="body">Occurred and recorded time</text>
    <circle cx="1124" cy="398" r="5" fill="#c2410c"/><text x="1140" y="404" class="body">Raw feedback, if actually received</text>
    <circle cx="1124" cy="438" r="5" fill="#c2410c"/><text x="1140" y="444" class="body">Why guidance changed</text>
    <rect x="1112" y="473" width="265" height="28" rx="14" fill="#fff7ed"/>
    <text x="1244" y="492" text-anchor="middle" class="tag" style="fill:#9a3412">Rejection ≠ capability ground truth</text>

    <!-- metrics -->
    <rect x="40" y="560" width="1360" height="132" rx="22" fill="#ffffff" stroke="#dbe4ee"/>
    <text x="62" y="592" class="small" style="font-weight:720;fill:#0f172a">CURRENT REPRODUCIBLE EVIDENCE · SYNTHETIC DATA ONLY</text>
    <line x1="335" y1="610" x2="335" y2="670" stroke="#e2e8f0"/>
    <line x1="605" y1="610" x2="605" y2="670" stroke="#e2e8f0"/>
    <line x1="875" y1="610" x2="875" y2="670" stroke="#e2e8f0"/>
    <line x1="1145" y1="610" x2="1145" y2="670" stroke="#e2e8f0"/>

    <text x="62" y="642" class="metric">33</text><text x="113" y="640" class="metric-label">graded candidate–job pairs</text>
    <text x="62" y="666" class="metric-label">3 candidates · 11 jobs</text>

    <text x="357" y="642" class="metric">0.974</text><text x="438" y="640" class="metric-label">structured NDCG@3</text>
    <text x="357" y="666" class="metric-label">TF-IDF baseline: 0.961</text>

    <text x="627" y="642" class="metric">0.000</text><text x="709" y="640" class="metric-label">cross-family violation@3</text>
    <text x="627" y="666" class="metric-label">after preserving and fixing a 0.111 failure</text>

    <text x="897" y="642" class="metric">3 / 3</text><text x="971" y="640" class="metric-label">hypothesis safety cases</text>
    <text x="897" y="666" class="metric-label">real-confirmed samples used: 0</text>

    <text x="1167" y="642" class="metric" style="fill:#b45309">0 / 2</text><text x="1241" y="640" class="metric-label">independent reviewers</text>
    <text x="1167" y="666" class="metric-label">honestly pending—not external validation</text>

    <text x="720" y="731" text-anchor="middle" class="footer">FastAPI · React · PostgreSQL · Redis · Alembic · Playwright · Owner-scoped, idempotent, model-off capable</text>
  </g>
</svg>
